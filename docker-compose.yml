version: '3.8'

services:
  # 1. PulseLayer Backend Server (Express + WebSockets + SQLite Indexer)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - DATA_DIR=/app/data
    volumes:
      - pulselayer-data:/app/data
    restart: always

  # 2. PulseLayer Next.js UI Frontend
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
      - NEXT_PUBLIC_WS_URL=ws://localhost:5001/ws
    depends_on:
      - server
    restart: always

volumes:
  pulselayer-data:
