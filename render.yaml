services:
  # 1. Express REST API + WebSocket Server + Horizon Live Stream Indexer
  - type: web
    name: pulselayer-server
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run dev:server
    healthCheckPath: /api/stats
    envVars:
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: pulselayer-db
      mountPath: /var/data
      sizeGB: 1

  # 2. Next.js Web Dashboard Frontend
  - type: web
    name: pulselayer-ui
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pulselayer-server
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: pulselayer-server
          property: url
